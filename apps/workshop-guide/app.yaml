command: ['npm', 'run', 'start']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Append-only progress table (apps/SPEC_workshop_guide.md, section 2). Used for the INSERT
  # from POST /api/progress and POST /api/check, the DELETE of "Reset my progress" and the
  # SELECT in server/sql/latest_progress.sql.
  - name: PROGRESS_TABLE
    value: retailhub_trainer.default.workshop_progress
  # Emails that may open /trainer (comma separated, case insensitive). Read from the
  # app resource "trainer-emails" (secret scope workshop-guide, key trainer-emails),
  # created by Terraform (infra/terraform/workshop_guide.tf) or by databricks.yml in a lab.
  - name: TRAINER_EMAILS
    valueFrom: trainer-emails
  # TRAINER_ACCOUNTS of notebooks/setup/00_setup (comma separated): their catalog is
  # retailhub_trainer, everybody else's retailhub_<slug>. The Check button reads the
  # participant's tables there. Secret key trainer-accounts in the same scope; `none`
  # when there are no trainer accounts.
  - name: TRAINER_ACCOUNTS
    valueFrom: trainer-accounts
  # Private quiz key (answers + explanations) in a Unity Catalog volume, read by the app
  # service principal with the Files API (README, "Quiz"). The app SP needs READ VOLUME.
  - name: QUIZ_KEY_PATH
    value: /Volumes/retailhub_trainer/default/workshop_guide_private/quiz_key.json
