bundle:
  name: workshop-guide

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  trainer_emails_scope:
    description: Secret scope holding trainer-emails and trainer-accounts (comma separated)
    default: workshop-guide

resources:
  apps:
    app:
      name: "workshop-guide"
      description: "Step-by-step guide for the Databricks Fundamental workshops with live progress"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # On-behalf-of-user: the Check button runs each step's check as the participant
      # (token in X-Forwarded-Access-Token). Participants also need CAN_USE on the
      # warehouse (README, "Check button").
      user_api_scopes:
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: trainer-emails
          secret:
            scope: ${var.trainer_emails_scope}
            key: trainer-emails
            permission: READ
        - name: trainer-accounts
          secret:
            scope: ${var.trainer_emails_scope}
            key: trainer-accounts
            permission: READ

targets:
  # Workspace comes from the CLI profile (--profile <name>); the warehouse id from
  # terraform output workshop_guide_warehouse_id:
  #   databricks bundle deploy --profile <profile> --var sql_warehouse_id=<id>
  default:
    default: true
